<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiSolAR - Panel de Control</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 15px 25px; border-radius: 8px; }
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        label { font-weight: bold; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #219150; }
        .btn-logout { background-color: #e74c3c; width: auto; padding: 8px 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #34495e; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h2>☀️ MiSolAR - Panel de Control</h2>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div class="container">
        <!-- 1. FORMULARIO DE INVENTARIO -->
        <h2>1. Registrar Panel Solar en Inventario</h2>
        <form id="formPanel" class="grid-form">
            <div>
                <label>Código de Serie:</label>
                <input type="text" id="codigo_serie" required>
            </div>
            <div>
                <label>Marca:</label>
                <input type="text" id="marca" required>
            </div>
            <div>
                <label>Modelo:</label>
                <input type="text" id="modelo" required>
            </div>
            <div>
                <label>Potencia (Watts):</label>
                <input type="number" id="potencia_watts" required>
            </div>
            <div>
                <label>Eficiencia (%):</label>
                <input type="number" step="0.01" id="eficiencia_porcentaje" required>
            </div>
            <div>
                <label>Precio Unitario ($):</label>
                <input type="number" step="0.01" id="precio_unitario" required>
            </div>
            <div>
                <label>Stock:</label>
                <input type="number" id="stock" value="1" required>
            </div>
            <div>
                <label>Estado:</label>
                <select id="estado">
                    <option value="Disponible">Disponible</option>
                    <option value="Instalado">Instalado</option>
                </select>
            </div>
            <button type="submit" style="grid-column: span 2;">Guardar Panel</button>
        </form>

        <h2>Inventario Actual (Consulta GET)</h2>
        <table>
            <thead>
                <tr>
                    <th>Serie</th>
                    <th>Marca/Modelo</th>
                    <th>Potencia</th>
                    <th>Precio</th>
                    <th>Stock</th>
                </tr>
            </thead>
            <tbody id="tablaPaneles"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
