<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiSolAR - Autenticación de Usuarios</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { max-width: 450px; margin: 40px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; width: 100%; }
        button { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #219150; }
        .toggle-btn { background-color: transparent; color: #2980b9; border: none; text-decoration: underline; margin-top: 15px; cursor: pointer; }
        .mensaje { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; display: none; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>☀️ MiSolAR</h1>

        <!-- Formulario de Login -->
        <div id="seccionLogin">
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <div class="form-group">
                    <label for="loginCorreo">Correo Electrónico:</label>
                    <input type="email" id="loginCorreo" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña:</label>
                    <input type="password" id="loginPassword" required placeholder="******">
                </div>
                <button type="submit">Ingresar</button>
            </form>
            <button class="toggle-btn" onclick="mostrarRegistro()">¿No tienes cuenta? Regístrate aquí</button>
        </div>

        <!-- Formulario de Registro (Oculto por defecto) -->
        <div id="seccionRegistro" style="display: none;">
            <h2>Crear Cuenta</h2>
            <form id="formRegistro">
                <div class="form-group">
                    <label for="regNombre">Nombre Completo:</label>
                    <input type="text" id="regNombre" required placeholder="Andrés Rhenals">
                </div>
                <div class="form-group">
                    <label for="regCorreo">Correo Electrónico:</label>
                    <input type="email" id="regCorreo" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="regPassword">Contraseña:</label>
                    <input type="password" id="regPassword" required placeholder="******">
                </div>
                <div class="form-group">
                    <label for="regRol">Rol de Usuario:</label>
                    <select id="regRol">
                        <option value="Tecnico">Técnico</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Cliente">Cliente</option>
                    </select>
                </div>
                <button type="submit">Registrar Usuario</button>
            </form>
            <button class="toggle-btn" onclick="mostrarLogin()">¿Ya tienes cuenta? Inicia Sesión</button>
        </div>

        <div id="mensajeRespuesta" class="mensaje"></div>
    </div>

    <script src="app.js"></script>
    <script>
        function mostrarRegistro() {
            document.getElementById('seccionLogin').style.display = 'none';
            document.getElementById('seccionRegistro').style.display = 'block';
            document.getElementById('mensajeRespuesta').style.display = 'none';
        }
        function mostrarLogin() {
            document.getElementById('seccionRegistro').style.display = 'none';
            document.getElementById('seccionLogin').style.display = 'block';
            document.getElementById('mensajeRespuesta').style.display = 'none';
        }
    </script>
</body>
</html>
