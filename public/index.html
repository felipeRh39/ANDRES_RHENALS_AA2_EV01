<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiSolAr - Autenticación</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; background-color: #27ae60; color: white; border: none; padding: 10px; margin-top: 15px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #219150; }
        .toggle-btn { background-color: transparent; color: #2980b9; border: none; margin-top: 10px; text-decoration: underline; font-size: 13px; }
        .mensaje { font-size: 13px; text-align: center; margin-top: 10px; color: #c0392b; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="titulo">Iniciar Sesión</h2>
    
    <div id="campoNombre" style="display: none;">
        <label>Nombre Completo:</label>
        <input type="text" id="nombre" placeholder="Andrés Rhenals">
    </div>

    <label>Correo Electrónico:</label>
    <input type="email" id="email" placeholder="usuario@correo.com">

    <label>Contraseña:</label>
    <input type="password" id="password" placeholder="••••••••">

    <button id="btnPrincipal" onclick="procesarFormulario()">Ingresar</button>
    
    <div class="mensaje" id="mensaje"></div>

    <button class="toggle-btn" id="btnToggle" onclick="cambiarModo()">¿No tienes cuenta? Regístrate aquí</button>
</div>

<script>
    let esModoRegistro = false;

    function cambiarModo() {
        esModoRegistro = !esModoRegistro;
        document.getElementById('titulo').innerText = esModoRegistro ? 'Crear Cuenta' : 'Iniciar Sesión';
        document.getElementById('campoNombre').style.display = esModoRegistro ? 'block' : 'none';
        document.getElementById('btnPrincipal').innerText = esModoRegistro ? 'Registrarse' : 'Ingresar';
        document.getElementById('btnToggle').innerText = esModoRegistro ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate aquí';
        document.getElementById('mensaje').innerText = '';
    }

    async function procesarFormulario() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const mensajeDiv = document.getElementById('mensaje');

        if (esModoRegistro) {
            const nombre = document.getElementById('nombre').value;
            const res = await fetch('/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, email, password })
            });
            const data = await res.json();
            if (data.exito) {
                alert('¡Registro exitoso en MySQL! Ahora puedes iniciar sesión.');
                cambiarModo();
            } else {
                mensajeDiv.innerText = data.error;
            }
        } else {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.exito) {
                localStorage.setItem('usuarioMiSolar', JSON.stringify(data.usuario));
                window.location.href = '/calculo.html';
            } else {
                mensajeDiv.innerText = data.error;
            }
        }
    }
</script>

</body>
</html>
